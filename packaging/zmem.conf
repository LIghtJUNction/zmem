# zmem uses PSI stall time and available memory to protect interactive work.
# Byte-size settings use MiB. reserve_mib=0 chooses an automatic RAM reserve.
interval_ms=2000
swap_chunk_mib=2048
max_disk_swap_mib=32768
disk_reserve_mib=8192
swap_free_target_mib=4096
reserve_mib=0
zram_percent=50
zram_enabled=true
protect_sessions=true
manage_swappiness=true
# Automatically scan only tasks explicitly launched with zmem run --dedup.
# Scanning pauses under CPU/memory/I/O pressure; no global unmerge is used.
dedup_enabled=true
profile=balanced
swap_dir=/var/lib/zmem/swap
